send_message:
  name: Send message as GHOST
  fields:
    message:
      required: true
      selector:
        text:
          multiline: true
    user_id:
      selector:
        text:
    channel_id:
      selector:
        text:
clear_friend_memory:
  name: Clear friend memory
  fields:
    user_id:
      required: true
      selector:
        text:

pause:
  name: Pause GHOST
  description: Stop starting new replies while allowing the current reply to finish.
resume:
  name: Resume GHOST
  description: Resume processing queued Discord messages.
clear_queue:
  name: Clear pending messages
  description: Discard queued messages without interrupting the active reply.
edit_queued_message:
  name: Edit pending message
  description: Change a message before GHOST processes it.
  fields:
    message_id:
      required: true
      selector:
        text:
    message:
      required: true
      selector:
        text:
          multiline: true
cancel_queued_message:
  name: Cancel pending message
  description: Remove one message from the pending queue.
  fields:
    message_id:
      required: true
      selector:
        text:
replay_transcript:
  name: Replay conversation
  description: Reprocess the original user messages from a retained transcript entry.
  fields:
    timestamp:
      required: true
      selector:
        text:
    conversation:
      required: true
      selector:
        text:
set_friend_memory:
  name: Correct contact memory
  description: Replace the durable memory summary for an approved Discord contact.
  fields:
    user_id:
      required: true
      selector:
        text:
    summary:
      required: true
      selector:
        text:
          multiline: true
set_context_note:
  name: Inject conversation context
  description: Set temporary admin context for one approved DM or selected server channel. The note is held in memory only.
  fields:
    conversation:
      required: true
      selector:
        text:
    context:
      required: true
      selector:
        text:
          multiline: true

update_settings:
  name: Save GHOST assistant configuration
  description: Save advanced assistant tuning and custom role prompts from the GHOST sidebar panel.
  fields:
    fallback_after_failures:
      required: true
      selector:
        number:
          min: 1
          max: 5
          mode: box
    queue_debounce_seconds:
      required: true
      selector:
        number:
          min: 0.5
          max: 15
          step: 0.5
          mode: box
    max_context_messages:
      required: true
      selector:
        number:
          min: 4
          max: 80
          mode: box
    context_budget_chars:
      required: true
      selector:
        number:
          min: 2000
          max: 50000
          mode: box
    history_limit:
      required: true
      selector:
        number:
          min: 20
          max: 200
          mode: box
    conversation_history_limit:
      required: true
      selector:
        number:
          min: 50
          max: 2000
          mode: box
    typing_enabled:
      required: true
      selector:
        boolean:
    assistant_group_channels:
      required: true
      selector:
        text:
    conversation_system_prompt:
      required: true
      selector:
        text:
          multiline: true
    operations_system_prompt:
      required: true
      selector:
        text:
          multiline: true
    advanced_system_prompt:
      required: true
      selector:
        text:
          multiline: true
    memory_system_prompt:
      required: true
      selector:
        text:
          multiline: true

update_contacts:
  name: Update GHOST friend list
  description: Add or remove contacts approved to message GHOST.
  fields:
    contacts:
      required: true
      selector:
        object:
