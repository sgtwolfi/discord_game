send_message:
  name: Send message as GHOST
  fields:
    message:
      required: true
      selector:
        text:
          multiline: true
    user_id:
      selector:
        text:
    channel_id:
      selector:
        text:
clear_friend_memory:
  name: Clear friend memory
  fields:
    user_id:
      required: true
      selector:
        text:

pause:
  name: Pause GHOST
  description: Stop starting new replies while allowing the current reply to finish.
resume:
  name: Resume GHOST
  description: Resume processing queued Discord messages.
clear_queue:
  name: Clear pending messages
  description: Discard queued messages without interrupting the active reply.
