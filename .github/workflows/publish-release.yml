name: Publish HACS release

on:
  workflow_run:
    workflows: ["Validate integration"]
    types: [completed]
    branches: ["master"]

permissions:
  contents: write

jobs:
  publish:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'master' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Create version tag and GitHub release
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const manifest = JSON.parse(fs.readFileSync('custom_components/discord_game/manifest.json', 'utf8'));
            const tag = 'v' + manifest.version;
            const commitSha = context.payload.workflow_run.head_sha;
            const { owner, repo } = context.repo;
            try {
              await github.rest.repos.getReleaseByTag({ owner, repo, tag });
              core.info(`Release ${tag} already exists; nothing to do.`);
              return;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            await github.rest.repos.createRelease({
              owner,
              repo,
              tag_name: tag,
              target_commitish: commitSha,
              name: tag,
              body: 'GHOST / Discord Game ' + manifest.version + '. This release passed the integration validation workflow.',
              draft: false,
              prerelease: false
            });
            core.info(`Published ${tag} from validated commit ${commitSha}`);
